<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuaderno ESP32 — Física y Electrónica</title>
<meta name="description" content="Cuaderno técnico-científico de proyecto ESP32 con 3 prácticas de física y electrónica: termohigrómetro, potenciómetro+LED+Bluetooth, sensor ultrasónico.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},svg:{fontCache:'global'}};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:#050E1A;
  font-family:'Fira Code','JetBrains Mono',monospace;
  font-size:14px;
  line-height:1.8;
  color:#AABBCC;
  overflow-x:hidden;
  min-height:100vh;
}
h1,h2,h3,h4,h5{font-family:'Orbitron','Rajdhani',sans-serif;color:#DDEEFF;letter-spacing:1px}

/* ═══════════════════════════════════════════════════════════════
   TOOLBAR (top bar)
   ═══════════════════════════════════════════════════════════════ */
#toolbar{
  position:fixed;top:0;left:0;right:0;height:44px;
  background:#0A1628;border-bottom:1px solid #1A3A6A;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;z-index:1000;
  font-family:'Rajdhani',sans-serif;
}
#toolbar .left-tools{display:flex;align-items:center;gap:12px}
#toolbar .right-tools{display:flex;align-items:center;gap:10px}
.tool-btn{
  background:transparent;border:1px solid #1A3A6A;
  color:#4A8A5A;border-radius:6px;padding:4px 10px;cursor:pointer;
  font-size:13px;font-family:'Fira Code',monospace;
  transition:all .2s;
}
.tool-btn:hover{background:rgba(0,204,102,0.1);border-color:#00CC66;color:#00CC66}
.tool-btn.active{background:rgba(0,204,102,0.15);border-color:#00CC66;color:#00CC66}
.highlight-colors{display:flex;gap:4px;align-items:center}
.hl-dot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s}
.hl-dot:hover,.hl-dot.active{border-color:#fff;transform:scale(1.2)}
.hl-green{background:#88FF88}
.hl-cyan{background:#88FFFF}
.hl-amber{background:#FFCC88}

/* ═══════════════════════════════════════════════════════════════
   PROGRESS BAR
   ═══════════════════════════════════════════════════════════════ */
#progress-bar{
  position:fixed;top:44px;left:0;height:3px;
  background:linear-gradient(90deg,#0066FF,#00AAFF,#00CCFF);
  z-index:999;transition:width .4s ease;border-radius:0 2px 2px 0;
  box-shadow:0 0 8px rgba(0,102,255,0.6);
}

/* ═══════════════════════════════════════════════════════════════
   NOTEBOOK CONTAINER
   ═══════════════════════════════════════════════════════════════ */
#notebook{
  margin-top:54px;
  display:flex;justify-content:center;align-items:flex-start;
  padding:30px 20px 80px;
  perspective:1400px;
  min-height:calc(100vh - 134px);
}
.book-wrapper{
  display:flex;position:relative;
  max-width:1300px;width:100%;
}

/* ═══════════════════════════════════════════════════════════════
   SPIRAL
   ═══════════════════════════════════════════════════════════════ */
.spiral{
  position:absolute;left:50%;transform:translateX(-50%);
  top:0;bottom:0;width:40px;z-index:10;
  display:flex;flex-direction:column;justify-content:space-evenly;
  align-items:center;pointer-events:none;
}
.spiral-ring{
  width:18px;height:18px;border:2.5px solid #2A4A8A;
  border-radius:50%;position:relative;
  background:linear-gradient(135deg,#1A3A6A,#2A4A8A,#4A7ACC,#2A4A8A);
  box-shadow:inset 0 1px 2px rgba(74,122,204,0.4),0 1px 3px rgba(0,0,0,0.4);
}

/* ═══════════════════════════════════════════════════════════════
   PAGES
   ═══════════════════════════════════════════════════════════════ */
.page{
  flex:1;min-height:700px;position:relative;
  background:#0A1628;
  border:1px solid #1A3A6A;
  border-radius:8px;
  box-shadow:0 4px 32px rgba(0,80,200,0.2),0 0 0 1px rgba(0,120,255,0.1);
  padding:40px 32px 40px 60px;
  transition:transform 0.7s ease-in-out,opacity 0.7s ease-in-out;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  overflow:hidden;
}
.page::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,120,255,0.08) 0.5px,transparent 0.5px),
    linear-gradient(90deg,rgba(0,120,255,0.08) 0.5px,transparent 0.5px);
  background-size:24px 24px;
  z-index:0;
}
.page>*{position:relative;z-index:1}
.page-left{margin-right:20px;border-radius:8px 0 0 8px}
.page-right{margin-left:20px;border-radius:0 8px 8px 0}
.page-number{
  position:absolute;bottom:12px;font-size:12px;color:#2A5A9A;
  font-family:'Orbitron',sans-serif;
}
.page-left .page-number{left:20px}
.page-right .page-number{right:20px}

/* Page flip animation */
.page.flipping-left{transform:rotateY(-90deg);opacity:0.3}
.page.flipping-right{transform:rotateY(90deg);opacity:0.3}

/* ═══════════════════════════════════════════════════════════════
   LATERAL TABS
   ═══════════════════════════════════════════════════════════════ */
#lateral-tabs{
  position:fixed;right:0;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:6px;z-index:100;
}
.tab-btn{
  writing-mode:vertical-lr;text-orientation:mixed;
  padding:12px 8px;border:none;border-radius:8px 0 0 8px;
  cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:12px;
  font-weight:600;letter-spacing:1px;color:#fff;
  transition:all .3s;box-shadow:-2px 0 8px rgba(0,0,0,0.3);
}
.tab-btn:hover{padding-right:14px}
.tab-p1{background:linear-gradient(180deg,#0044CC,#0066FF)}
.tab-p2{background:linear-gradient(180deg,#009944,#00CC66)}
.tab-p3{background:linear-gradient(180deg,#0088AA,#00AACC)}

/* ═══════════════════════════════════════════════════════════════
   NAVIGATION
   ═══════════════════════════════════════════════════════════════ */
#nav-controls{
  position:fixed;bottom:34px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:16px;z-index:100;
}
.nav-btn{
  background:#0A1A3A;border:1px solid #0066FF;color:#4488FF;
  border-radius:8px;padding:8px 20px;cursor:pointer;
  font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;
  transition:all .3s;letter-spacing:1px;
}
.nav-btn:hover{background:#0F2A4A;color:#66AAFF;box-shadow:0 0 12px rgba(0,102,255,0.3)}
.nav-btn:disabled{opacity:0.3;cursor:not-allowed}
#page-indicator{color:#4488FF;font-family:'Orbitron',sans-serif;font-size:13px}

/* ═══════════════════════════════════════════════════════════════
   CONTENT BOXES
   ═══════════════════════════════════════════════════════════════ */
.box{border-radius:12px;padding:16px;margin-bottom:16px;border-width:2px;border-style:solid}
.box-blue{background:#0F1E38;border-color:#0066FF;box-shadow:0 0 12px rgba(0,102,255,0.3)}
.box-green{background:#0A1E14;border-color:#00CC66;box-shadow:0 0 12px rgba(0,204,102,0.3)}
.box-amber{background:#1E1400;border-color:#CC8800;box-shadow:0 0 12px rgba(204,136,0,0.3)}
.box-red{background:#1E0808;border-color:#CC2222;box-shadow:0 0 12px rgba(204,34,34,0.3)}
.box-cyan{background:#0A1E1E;border-color:#00AACC;box-shadow:0 0 12px rgba(0,170,204,0.3)}
.box-purple{background:#140A1E;border-color:#8844CC;box-shadow:0 0 12px rgba(136,68,204,0.3)}

.box h3{margin-bottom:8px;font-size:15px}
.box-blue h3{color:#4488FF}
.box-green h3{color:#00CC66}
.box-amber h3{color:#FFAA00}
.box-red h3{color:#CC2222}
.box-cyan h3{color:#00AACC}
.box-purple h3{color:#8844CC}

/* ═══════════════════════════════════════════════════════════════
   PILLS / BADGES
   ═══════════════════════════════════════════════════════════════ */
.pill{
  display:inline-block;padding:2px 10px;border-radius:20px;
  font-size:11px;font-weight:600;margin:2px;letter-spacing:0.5px;
  font-family:'Rajdhani',sans-serif;
}
.pill-green{background:rgba(0,204,102,0.15);color:#00CC66;border:1px solid rgba(0,204,102,0.3)}
.pill-amber{background:rgba(204,136,0,0.15);color:#FFAA00;border:1px solid rgba(204,136,0,0.3)}
.pill-blue{background:rgba(0,102,255,0.15);color:#4488FF;border:1px solid rgba(0,102,255,0.3)}
.pill-cyan{background:rgba(0,170,204,0.15);color:#44CCEE;border:1px solid rgba(0,170,204,0.3)}
.pill-red{background:rgba(204,34,34,0.15);color:#FF6666;border:1px solid rgba(204,34,34,0.3)}
.pill-purple{background:rgba(136,68,204,0.15);color:#AA66EE;border:1px solid rgba(136,68,204,0.3)}

/* ═══════════════════════════════════════════════════════════════
   CODE BLOCKS
   ═══════════════════════════════════════════════════════════════ */
.code-block{
  background:#020810;border-left:3px solid #00FF88;
  border-radius:8px;padding:0;margin-bottom:16px;
  position:relative;overflow:hidden;
}
.code-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 16px;background:#0A1220;border-bottom:1px solid #1A2A3A;
}
.code-header .lang{color:#00FF88;font-size:12px;font-weight:600}
.copy-btn{
  background:#0A2A0A;color:#00FF88;border:1px solid #00FF88;
  border-radius:4px;padding:3px 10px;cursor:pointer;font-size:11px;
  font-family:'Fira Code',monospace;transition:all .2s;
}
.copy-btn:hover{background:#00FF88;color:#020810}
.code-content{
  padding:16px 16px 16px 0;overflow-x:auto;
  font-family:'Fira Code','JetBrains Mono',monospace;
  font-size:12.5px;line-height:1.7;counter-reset:line;
}
.code-line{display:flex;min-height:1.7em}
.code-line:hover{background:rgba(0,120,255,0.05)}
.line-num{
  min-width:40px;text-align:right;padding-right:12px;
  color:#2A4A6A;font-size:11px;user-select:none;
  border-right:1px solid #0A1A2A;margin-right:12px;
}
.code-text{white-space:pre;color:#AABBCC}

/* Syntax colors */
.kw{color:#4488FF}        /* keywords */
.str{color:#FFA040}       /* strings */
.cmt{color:#4A8A5A;font-style:italic} /* comments */
.num{color:#FFCC44}       /* numbers */
.fn{color:#44CCEE}        /* functions */
.type{color:#FFAA00}      /* types/constants */
.op{color:#CCCCCC}        /* operators */
.prep{color:#4488FF}      /* preprocessor */
.inc{color:#FFA040}       /* includes */

/* ═══════════════════════════════════════════════════════════════
   CONNECTION TABLES
   ═══════════════════════════════════════════════════════════════ */
.conn-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
.conn-table th{
  background:#1E1000;color:#FFAA00;padding:8px 10px;
  text-align:left;font-weight:700;border:1px solid #2A2000;
  font-family:'Rajdhani',sans-serif;letter-spacing:0.5px;
}
.conn-table td{
  padding:6px 10px;border:1px solid #2A2000;
  font-family:'Fira Code',monospace;font-size:11px;
}
.conn-table tr:nth-child(even) td{background:#120E00}
.conn-table tr:nth-child(odd) td{background:#0A0800}
.cable-dot{
  display:inline-block;width:12px;height:12px;border-radius:50%;
  margin-right:6px;vertical-align:middle;
  box-shadow:0 0 4px rgba(255,255,255,0.2);
}

/* ═══════════════════════════════════════════════════════════════
   FRITZING IMAGES
   ═══════════════════════════════════════════════════════════════ */
.fritzing-frame{
  border:2px solid #0066FF;border-radius:10px;overflow:hidden;
  box-shadow:0 0 20px rgba(0,102,255,0.3);margin:12px 0;
  cursor:pointer;transition:transform .3s;
}
.fritzing-frame:hover{transform:scale(1.02)}
.fritzing-frame img{width:100%;display:block}
.fritzing-caption{
  text-align:center;padding:8px;background:#0A1628;
  color:#4488FF;font-size:12px;font-family:'Rajdhani',sans-serif;
  border-top:1px solid #1A3A6A;
}

/* ═══════════════════════════════════════════════════════════════
   IMAGE MODAL
   ═══════════════════════════════════════════════════════════════ */
#img-modal{
  display:none;position:fixed;inset:0;background:rgba(0,5,15,0.95);
  z-index:2000;justify-content:center;align-items:center;
  flex-direction:column;
}
#img-modal.show{display:flex}
#img-modal img{max-width:90vw;max-height:80vh;border:2px solid #0066FF;border-radius:8px;transition:transform .3s}
.modal-controls{
  display:flex;gap:10px;margin-top:16px;
}
.modal-btn{
  background:#0A1A3A;border:1px solid #0066FF;color:#4488FF;
  border-radius:6px;padding:6px 16px;cursor:pointer;font-size:13px;
  font-family:'Rajdhani',sans-serif;transition:all .2s;
}
.modal-btn:hover{background:#0F2A4A;color:#88BBFF}

/* ═══════════════════════════════════════════════════════════════
   FORMULA BOXES
   ═══════════════════════════════════════════════════════════════ */
.formula-box{
  background:#020810;border:1.5px solid #00AACC;
  border-radius:10px;padding:12px 20px;margin:12px 0;
  box-shadow:0 0 12px rgba(0,170,204,0.2);
  text-align:center;font-size:15px;color:#DDEEFF;
}

/* ═══════════════════════════════════════════════════════════════
   CHAPTER HEADER
   ═══════════════════════════════════════════════════════════════ */
.chapter-header{
  background:linear-gradient(180deg,#0A1628,#0F2A4A);
  border-radius:12px;padding:30px 24px;margin-bottom:20px;
  border:1px solid #1A3A6A;text-align:center;
}
.chapter-badge{
  display:inline-block;padding:4px 18px;border-radius:20px;
  background:rgba(204,136,0,0.2);color:#FFAA00;
  border:1px solid #CC8800;font-family:'Orbitron',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:2px;margin-bottom:12px;
}
.chapter-title{
  font-size:22px;color:#fff;
  text-shadow:0 0 20px rgba(0,102,255,0.4);
  margin-bottom:12px;
}
.chapter-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}

/* ═══════════════════════════════════════════════════════════════
   COVER PAGE
   ═══════════════════════════════════════════════════════════════ */
.cover{
  background:radial-gradient(ellipse at center,#0A1628 0%,#020810 100%);
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;
  position:relative;overflow:hidden;
}
.cover::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(0,120,255,0.04) 0.5px,transparent 0.5px),
    linear-gradient(90deg,rgba(0,120,255,0.04) 0.5px,transparent 0.5px);
  background-size:32px 32px;
  animation:gridMove 20s linear infinite;
}
@keyframes gridMove{
  0%{transform:translate(0,0)}
  100%{transform:translate(32px,32px)}
}
.cover-title{
  font-family:'Orbitron',sans-serif;font-size:28px;
  color:#fff;text-shadow:0 0 30px rgba(0,102,255,0.5);
  margin-bottom:8px;letter-spacing:3px;position:relative;z-index:2;
}
.cover-subtitle{
  font-family:'Rajdhani',sans-serif;font-size:16px;
  color:#6699CC;letter-spacing:2px;margin-bottom:24px;
  position:relative;z-index:2;
}
.cover-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px 0;position:relative;z-index:2}
.cover-chip{
  padding:4px 14px;border-radius:6px;font-size:12px;
  font-family:'Rajdhani',sans-serif;font-weight:600;
  background:rgba(0,102,255,0.1);color:#4488FF;
  border:1px solid rgba(0,102,255,0.3);
}
.cover-footer{
  position:absolute;bottom:20px;text-align:center;
  font-size:12px;color:#4A6A8A;z-index:2;
}
.cover-author{
  font-size:13px;color:#6699CC;margin-top:4px;
  font-family:'Rajdhani',sans-serif;
}

/* Particles */
.particles{position:absolute;inset:0;overflow:hidden;z-index:1}
.particle{
  position:absolute;width:3px;height:3px;background:#0066FF;
  border-radius:50%;opacity:0.4;animation:float-particle linear infinite;
}
@keyframes float-particle{
  0%{transform:translateY(100vh) translateX(0);opacity:0}
  10%{opacity:0.6}
  90%{opacity:0.6}
  100%{transform:translateY(-100px) translateX(50px);opacity:0}
}

/* ESP32 Chip SVG */
.esp32-chip{
  width:160px;height:160px;margin:20px auto;position:relative;z-index:2;
}
.chip-body{fill:#0A1628;stroke:#2A4A8A;stroke-width:2}
.chip-pin{fill:#4A7ACC;animation:pinGlow 2s ease-in-out infinite alternate}
@keyframes pinGlow{0%{opacity:0.4}100%{opacity:1}}
.chip-text{fill:#FFAA00;font-family:'Orbitron',sans-serif;font-size:8px;text-anchor:middle}
.chip-label{fill:#00CC66;font-family:'Fira Code',monospace;font-size:5px;text-anchor:middle}

/* ═══════════════════════════════════════════════════════════════
   SIMULATIONS
   ═══════════════════════════════════════════════════════════════ */
.sim-container{
  background:#020810;border:2px solid #0066FF;border-radius:12px;
  padding:20px;margin:16px 0;box-shadow:0 0 20px rgba(0,102,255,0.2);
}
.sim-title{
  color:#4488FF;font-family:'Orbitron',sans-serif;font-size:14px;
  margin-bottom:12px;text-align:center;
}
.sim-canvas{
  display:block;margin:0 auto;border:1px solid #1A3A6A;border-radius:8px;
  background:#020810;
}
.sim-controls{
  display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;align-items:center;
  justify-content:center;
}
.sim-slider{
  -webkit-appearance:none;width:200px;height:6px;
  background:#1A3A6A;border-radius:3px;outline:none;
}
.sim-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;
  border-radius:50%;background:#00CC66;cursor:pointer;
  box-shadow:0 0 6px rgba(0,204,102,0.5);
}
.sim-label{color:#6699CC;font-size:12px}
.sim-value{color:#FFCC44;font-size:13px;font-weight:600}
.sim-btn{
  background:#0A2A0A;color:#00CC66;border:1px solid #00CC66;
  border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12px;
  font-family:'Fira Code',monospace;transition:all .2s;
}
.sim-btn:hover{background:#00CC66;color:#020810}

/* OLED Sim Display */
.oled-sim{
  width:260px;height:130px;background:#000;border:3px solid #2A4A8A;
  border-radius:8px;margin:10px auto;padding:10px;
  font-family:'Fira Code',monospace;color:#fff;
  box-shadow:0 0 15px rgba(42,74,138,0.4);
}
.oled-sim .oled-line{font-size:11px;line-height:1.4}
.oled-sim .oled-big{font-size:18px;font-weight:700}

/* Serial Monitor Sim */
.serial-monitor{
  width:100%;max-height:150px;overflow-y:auto;
  background:#020810;border:1px solid #1A3A6A;border-radius:6px;
  padding:8px;font-family:'Fira Code',monospace;font-size:11px;
  color:#00CC66;margin:8px 0;
}

/* Radar */
.radar-container{display:flex;justify-content:center;margin:10px 0}

/* ═══════════════════════════════════════════════════════════════
   CHART CONTAINERS
   ═══════════════════════════════════════════════════════════════ */
.chart-container{
  background:#020810;border:1.5px solid #0066FF;border-radius:10px;
  padding:16px;margin:16px 0;box-shadow:0 0 16px rgba(0,102,255,0.2);
  position:relative;
}
.chart-title{
  color:#4488FF;font-family:'Orbitron',sans-serif;
  font-size:13px;text-align:center;margin-bottom:8px;
}
.chart-canvas{
  display:block;margin:0 auto;background:#020810;
  border-radius:6px;
}
.chart-controls{
  display:flex;gap:8px;justify-content:center;margin-top:8px;
}
.chart-btn{
  background:#0A1A3A;border:1px solid #0066FF;color:#4488FF;
  border-radius:4px;padding:3px 10px;cursor:pointer;font-size:11px;
  font-family:'Fira Code',monospace;transition:all .2s;
}
.chart-btn:hover{background:#0F2A4A;color:#88BBFF}

/* ═══════════════════════════════════════════════════════════════
   INDEX DROPDOWN
   ═══════════════════════════════════════════════════════════════ */
#index-dropdown{

// Syntax highlighter
function hl(code) {
  // Escape HTML
  let s = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Comments (multi-line first, then single-line)
  s = s.replace(/(\/\*[\s\S]*?\*\/)/g,'<span class="cmt">$1</span>');
  s = s.replace(/(\/\/.*)/g,'<span class="cmt">$1</span>');
  // Strings
  s = s.replace(/(&quot;[^&]*?&quot;|"[^"]*?")/g,'<span class="str">$1</span>');
  // Preprocessor
  s = s.replace(/(#include|#define|#ifdef|#endif|#ifndef|#if)\b/g,'<span class="prep">$1</span>');
  // Include paths
  s = s.replace(/(&lt;[A-Za-z_][A-Za-z0-9_\.]*\.h&gt;)/g,'<span class="inc">$1</span>');
  // Keywords
  s = s.replace(/\b(void|int|float|bool|long|char|const|if|else|while|for|return|true|false|do|switch|case|break|continue|unsigned|static|class|struct|enum|sizeof|typedef|namespace|using|new|delete|this|nullptr|auto)\b/g,'<span class="kw">$1</span>');
  // Types and constants
  s = s.replace(/\b(HIGH|LOW|INPUT|OUTPUT|INPUT_PULLUP|SSD1306_SWITCHCAPVCC|SSD1306_WHITE|SH110X_WHITE|DHT22|DHT11|PROGMEM|WL_CONNECTED|NAN)\b/g,'<span class="type">$1</span>');
  // Functions
  s = s.replace(/\b(setup|loop|Serial|Wire|WiFi|display|oled|dht|BT|servidor|pinMode|digitalWrite|digitalRead|analogRead|delay|delayMicroseconds|pulseIn|map|constrain|isnan|ledcAttach|ledcWrite|begin|print|println|clearDisplay|setTextSize|setTextColor|setCursor|readHumidity|readTemperature|drawRect|drawCircle|fillCircle|fillRect|drawFastHLine|handleClient|send|on|arg|status|localIP)\b/g,'<span class="fn">$1</span>');
  // Numbers
  s = s.replace(/\b(\d+\.?\d*[fFL]?)\b/g,'<span class="num">$1</span>');
  return s;
}

function codeBlock(code, lang='C++') {
  const lines = code.split('\n');
  let html = '<div class="code-block"><div class="code-header"><span class="lang">' + lang + '</span>';
  html += '<button class="copy-btn" onclick="copyCode(this)">📋 Copiar código</button></div>';
  html += '<div class="code-content">';
  lines.forEach((line, i) => {
    html += '<div class="code-line"><span class="line-num">' + (i+1) + '</span><span class="code-text">' + hl(line) + '</span></div>';
  });
  html += '</div></div>';
  return html;
}

const CODE_P1_MAIN = `/*  ═══════════════════════════════════════════════════════════════════
    ESP32 + DHT22 (GPIO 4) + OLED SH1106 1.3" (I2C, 0x3C)
    Termo-higrómetro con termómetro gráfico a la izquierda
    ───────────────────────────────────────────────────────────────────
    Autor base: Msc. Néstor Fabio Montoya Palacios
    Versión revisada: asistida por IA
    ───────────────────────────────────────────────────────────────────
    Librerías a instalar desde el Gestor de Bibliotecas del IDE:
        · Adafruit SH110X          <-- NUEVA (reemplaza Adafruit SSD1306)
        · Adafruit GFX Library
        · DHT sensor library (by Adafruit)
        · Adafruit Unified Sensor

    Conexiones:
        ┌──────────┬───────────┬─────────────┐
        │ Módulo   │ Pin       │ ESP32       │
        ├──────────┼───────────┼─────────────┤
        │ OLED     │ GND       │ GND         │
        │ OLED     │ VDD       │ 3V3         │
        │ OLED     │ SCK (SCL) │ GPIO 22     │
        │ OLED     │ SDA       │ GPIO 21     │
        ├──────────┼───────────┼─────────────┤
        │ DHT22    │ +  (VCC)  │ 3V3         │
        │ DHT22    │ OUT       │ GPIO 4      │
        │ DHT22    │ -  (GND)  │ GND         │
        └──────────┴───────────┴─────────────┘
    ═══════════════════════════════════════════════════════════════════ */

#include <Wire.h>
#include <Adafruit_GFX.h>
#include <Adafruit_SH110X.h>      // ← Controlador correcto para SH1106
#include "DHT.h"


// ─── 1.  Configuración de la pantalla OLED ──────────────────────────
#define ANCHO     128
#define ALTO       64
#define DIR_OLED  0x3C   // Si no inicia, prueba con 0x3D
                         // (mira el puente ADRESS_SELECT en tu placa)

// SH1106 necesita i2c_address en el constructor; el -1 es reset (no usado)
Adafruit_SH1106G oled(ANCHO, ALTO, &Wire, -1);


// ─── 2.  Configuración del sensor DHT22 ─────────────────────────────
#define PIN_DHT    4
#define TIPO_DHT   DHT22

DHT dht(PIN_DHT, TIPO_DHT, 22);


// ─── 3.  Rango visual del termómetro ───────────────────────────────
const float T_MIN =  0.0;
const float T_MAX = 40.0;


// ─── 4.  Intervalo entre lecturas ──────────────────────────────────
const uint32_t INTERVALO_MS = 2000;


// ─── 5.  Memoria del último valor válido ───────────────────────────
float ultimaT = NAN;
float ultimaH = NAN;



/* ════════════════════════════════════════════════════════════════════
   FUNCIÓN: dibujarTermometro(tempC)
   ════════════════════════════════════════════════════════════════════ */
void dibujarTermometro(float tempC) {

    if (tempC < T_MIN) tempC = T_MIN;
    if (tempC > T_MAX) tempC = T_MAX;

    const int x_tubo    =  4;
    const int y_tubo    =  4;
    const int ancho     = 10;
    const int alto_tubo = 42;
    const int r_bulbo   =  7;

    int cx = x_tubo + ancho / 2;
    int cy = y_tubo + alto_tubo + r_bulbo - 1;

    oled.drawRect  (x_tubo, y_tubo, ancho, alto_tubo, SH110X_WHITE);
    oled.drawCircle(cx, cy, r_bulbo, SH110X_WHITE);

    int x_marca = x_tubo + ancho + 1;
    oled.drawFastHLine(x_marca, y_tubo,                 3, SH110X_WHITE);
    oled.drawFastHLine(x_marca, y_tubo + alto_tubo/2,   3, SH110X_WHITE);
    oled.drawFastHLine(x_marca, y_tubo + alto_tubo - 1, 3, SH110X_WHITE);

    float prop  = (tempC - T_MIN) / (T_MAX - T_MIN);
    int   nivel = (int)(prop * alto_tubo);
    int   y_niv = y_tubo + alto_tubo - nivel;

    oled.fillCircle(cx, cy, r_bulbo - 2, SH110X_WHITE);
    if (nivel > 0) {
        oled.fillRect(x_tubo + 2, y_niv, ancho - 4, nivel, SH110X_WHITE);
    }
}



/* ════════════════════════════════════════════════════════════════════
   FUNCIÓN: mostrarDatos(t, h)
   ════════════════════════════════════════════════════════════════════ */
void mostrarDatos(float t, float h) {

    oled.clearDisplay();
    oled.setTextColor(SH110X_WHITE);      // ← constante del nuevo driver

    dibujarTermometro(t);

    oled.setTextSize(1);
    oled.setCursor(30, 2);
    oled.print("Temperatura:");

    oled.setTextSize(2);
    oled.setCursor(30, 12);
    oled.print(t, 1);
    oled.print((char)248);
    oled.print("C");

    oled.setTextSize(1);
    oled.setCursor(30, 36);
    oled.print("Humedad:");

    oled.setTextSize(2);
    oled.setCursor(30, 46);
    oled.print(h, 1);
    oled.print(" %");

    oled.display();
}



/* ════════════════════════════════════════════════════════════════════
   setup()
   ════════════════════════════════════════════════════════════════════ */
void setup() {

    Serial.begin(115200);
    delay(200);
    Serial.println("\\n=== ESP32 + DHT22 + SH1106 1.3\\" ===");

    Wire.begin(21, 22);   // SDA=21, SCL=22

    // begin() en Adafruit_SH110X recibe la dirección I2C
    if (!oled.begin(DIR_OLED, true)) {
        Serial.println("ERROR: OLED SH1106 no detectada. Revisa cableado/direccion.");
        while (true) delay(10);
    }

    dht.begin();

    oled.clearDisplay();
    oled.setTextColor(SH110X_WHITE);
    oled.setTextSize(1);
    oled.setCursor(0, 16);
    oled.println("  ESP32 + DHT22");
    oled.println("");
    oled.println("  Leyendo sensor...");
    oled.display();
    delay(2000);
}



/* ════════════════════════════════════════════════════════════════════
   loop()
   ════════════════════════════════════════════════════════════════════ */
void loop() {

    float t = dht.readTemperature();
    float h = dht.readHumidity();

    if (isnan(t) || isnan(h)) {
        Serial.println("Lectura fallida, reintentando...");
    } else {
        ultimaT = t;
        ultimaH = h;
        Serial.print("T = ");  Serial.print(t, 1);  Serial.print(" C   ");
        Serial.print("H = ");  Serial.print(h, 1);  Serial.println(" %");
    }

    if (!isnan(ultimaT)) {
        mostrarDatos(ultimaT, ultimaH);
    }

    delay(INTERVALO_MS);
}`;

const CODE_P2_BASIC = `/* ═══════════════════════════════════════════════════════════════
 *   Práctica: Controlar el brillo de un LED con un potenciómetro
 *   ─────────────────────────────────────────────────────────────
 *   ¿Qué hace este programa?
 *   - Lee la posición del potenciómetro: 0 a 4095
 *   - Convierte ese valor en voltaje: 0 a 3.3 V
 *   - Cambia el brillo del LED mediante PWM
 *   - Muestra los datos en el monitor serial
 *
 *   Profesor: Msc. Néstor Fabio Montoya Palacios
 * ═══════════════════════════════════════════════════════════════ */


// Pines utilizados
const int pinPotenciometro = 34;   // GPIO34: entrada analógica (ADC1_CH6)
const int pinLED = 4;              // GPIO4:  salida PWM para el LED

// Configuración PWM para ESP32
const int frecuenciaPWM = 5000;    // Frecuencia PWM en Hz
const int resolucionPWM = 8;       // Resolución de 8 bits: valores de 0 a 255


void setup() {
  // Iniciamos la comunicación serial
  Serial.begin(115200);

  // El pin del potenciómetro será entrada
  pinMode(pinPotenciometro, INPUT);

  // Configuramos PWM en el pin del LED
  ledcAttach(pinLED, frecuenciaPWM, resolucionPWM);

  // Mensaje inicial
  Serial.println("¡Comenzamos la práctica!");
  Serial.println("-------------------------");
}


void loop() {

  // PASO 1: Leer el potenciómetro
  // El ESP32 entrega un valor entre 0 y 4095
  int valor = analogRead(pinPotenciometro);

  // PASO 2: Convertir el valor leído a voltaje
  // 4095 equivale aproximadamente a 3.3 V
  float voltaje = (valor * 3.3) / 4095.0;

  // PASO 3: Convertir el valor analógico a brillo PWM
  // Potenciómetro: 0 a 4095
  // PWM LED:       0 a 255
  int brillo = map(valor, 0, 4095, 0, 255);

  // Limitamos el valor por seguridad
  brillo = constrain(brillo, 0, 255);

  // PASO 4: Aplicar el brillo al LED
  // Como el LED está en configuración active-low (cátodo al GPIO),
  // restamos a 255 para que más giro = más brillo
  ledcWrite(pinLED, 255 - brillo);

  // PASO 5: Mostrar datos en el monitor serial
  Serial.print("Valor: ");
  Serial.print(valor);

  Serial.print("   Voltaje: ");
  Serial.print(voltaje, 2);

  Serial.print(" V   Brillo PWM: ");
  Serial.println(brillo);

  // Pequeña pausa para no saturar el monitor serial
  delay(300);
}`;

const CODE_P2_BT = `/* ═══════════════════════════════════════════════════════════════
 *   Práctica: Potenciómetro + LED + Bluetooth con ESP32
 *   ─────────────────────────────────────────────────────────────
 *   ¿Qué hace este programa?
 *   - Lee el potenciómetro (valor entre 0 y 4095)
 *   - Convierte ese valor en voltaje (entre 0 y 3.3 V)
 *   - Enciende el LED con brillo proporcional al voltaje
 *   - Muestra los datos en el monitor serial (cable USB)
 *   - Envía los datos al celular vía Bluetooth
 *
 *   App en el celular: Serial Bluetooth Terminal
 *
 *   Profesor: Msc. Néstor Fabio Montoya Palacios
 * ═══════════════════════════════════════════════════════════════ */


// Librería para usar Bluetooth Serial
#include "BluetoothSerial.h"

// Creamos un objeto Bluetooth (lo llamamos "BT")
BluetoothSerial BT;


// Pines utilizados
const int pinPotenciometro = 34;   // GPIO34: entrada del potenciómetro
const int pinLED = 4;              // GPIO4:  salida PWM para el LED

// Configuración del PWM (para controlar el brillo)
const int frecuenciaPWM = 5000;    // 5000 Hz
const int resolucionPWM = 8;       // 8 bits → valores de 0 a 255


void setup() {
  // Iniciamos la comunicación con el computador
  Serial.begin(115200);

  // Iniciamos el Bluetooth con un nombre visible para el celular
  BT.begin("ESP32_ALEJO");

  // Configuramos el pin del potenciómetro como entrada
  pinMode(pinPotenciometro, INPUT);

  // ─────────────────────────────────────────────────────────────
  //   ¿Qué es esta línea?
  //   ledcAttach configura el pin del LED para usar PWM.
  //
  //   ¿Qué es PWM?
  //   PWM significa "Modulación por Ancho de Pulso" (en inglés:
  //   Pulse Width Modulation). Es una forma de simular voltajes
  //   intermedios encendiendo y apagando el LED muy rápido.
  //
  //   ¿Cómo logra cambiar el brillo?
  //   - Si el LED está encendido el 100% del tiempo → brillo máximo
  //   - Si está encendido el 50% del tiempo → brillo medio
  //   - Si está encendido el 0% del tiempo → apagado
  //   Como el ojo humano no percibe el parpadeo (es muy rápido),
  //   vemos un brillo continuo.
  //
  //   ¿Qué significan los tres parámetros?
  //   1) pinLED         → en qué pin queremos usar PWM (GPIO4)
  //   2) frecuenciaPWM  → cuántas veces por segundo se prende y
  //                       apaga el LED (5000 veces por segundo)
  //   3) resolucionPWM  → cuántos niveles de brillo distintos
  //                       podemos tener (8 bits = 256 niveles,
  //                       de 0 hasta 255)
  //
  //   ¿Y "ledc"? ¿Qué significa?
  //   "LEDC" es el nombre del módulo de hardware del ESP32 que
  //   genera la señal PWM. Significa "LED Controller" porque se
  //   diseñó originalmente para controlar LEDs, pero también
  //   sirve para motores, servos, parlantes, etc.
  // ─────────────────────────────────────────────────────────────
  ledcAttach(pinLED, frecuenciaPWM, resolucionPWM);

  // Mensaje de bienvenida
  Serial.println("¡Comenzamos la práctica!");
  Serial.println("Bluetooth listo: conéctate desde tu celular");
  Serial.println("--------------------------------------------");
}


void loop() {

  // PASO 1: Leer el potenciómetro
  // El ESP32 nos da un número entre 0 y 4095
  int valor = analogRead(pinPotenciometro);

  // PASO 2: Convertir el valor leído a voltaje (0 a 3.3 V)
  float voltaje = (valor * 3.3) / 4095.0;

  // PASO 3: Calcular el brillo del LED (entre 0 y 255)
  int brillo = map(valor, 0, 4095, 0, 255);

  // PASO 4: Encender el LED con ese brillo
  ledcWrite(pinLED, brillo);

  // PASO 5: Preparar el mensaje con los datos
  String mensaje = "Valor: " + String(valor) +
                   "   Voltaje: " + String(voltaje, 2) + " V" +
                   "   Brillo: " + String(brillo);

  // PASO 6: Enviar el mensaje por el cable USB
  Serial.println(mensaje);

  // PASO 7: Enviar el mismo mensaje por Bluetooth al celular
  BT.println(mensaje);

  // Pequeña pausa para no saturar el monitor
  delay(300);
}`;

const CODE_P3 = `#include <Wire.h>
#include <Adafruit_GFX.h>
#include <Adafruit_SSD1306.h>

// Pines del HC-SR04
const int trigPin = 2;
const int echoPin = 4;

// Configuración de la pantalla OLED
#define SCREEN_WIDTH 128
#define SCREEN_HEIGHT 64
#define OLED_RESET -1

// Crear objeto display SSD1306
Adafruit_SSD1306 display(SCREEN_WIDTH, SCREEN_HEIGHT, &Wire, OLED_RESET);

void setup() {
  Serial.begin(115200);

  // Inicializar I2C
  Wire.begin();

  // Inicializar pantalla
  if (!display.begin(SSD1306_SWITCHCAPVCC, 0x3C)) {
    Serial.println("No se encontró la pantalla OLED");
    while (true);
  }

  // Mensaje de prueba
  display.clearDisplay();
  display.setTextSize(2);
  display.setTextColor(SSD1306_WHITE);
  display.setCursor(0, 20);
  display.println("OLED OK");
  display.display();

  delay(2000);

  // Configurar HC-SR04
  pinMode(trigPin, OUTPUT);
  pinMode(echoPin, INPUT);
}

void loop() {
  // Generar pulso TRIG
  digitalWrite(trigPin, LOW);
  delayMicroseconds(2);
  digitalWrite(trigPin, HIGH);
  delayMicroseconds(10);
  digitalWrite(trigPin, LOW);

  // Medir duración
  long duration = pulseIn(echoPin, HIGH, 30000);

  // Calcular distancia
  float distance = duration / 58.4;

  // Mostrar en Serial
  Serial.print("Distancia: ");
  Serial.print(distance);
  Serial.println(" cm");

  // Mostrar en pantalla
  display.clearDisplay();
  display.setTextSize(2);
  display.setTextColor(SSD1306_WHITE);

  display.setCursor(0, 0);
  display.println("Distancia");

  display.setCursor(0, 30);
  display.print(distance, 1);
  display.print(" cm");

  display.display();

  delay(500);
}`;

  <p style="margin-top:8px">La <strong style="color:#4488FF">humedad relativa</strong> (HR) es la relación entre la cantidad de vapor de agua presente y la máxima que puede contener a esa temperatura:</p>

<h2 class="section-title">📐 Conceptos Físicos</h2>
<div class="box box-blue">
  <h3>⚡ Conversión Analógico-Digital (ADC)</h3>
  <p style="font-size:12px">El <span class="sensor">ESP32</span> tiene un ADC de <span class="numval">12 bits</span>, que convierte voltajes analógicos (0-3.3V) en valores digitales (0-4095). La relación es lineal:</p>
  <div class="formula-box">
    $$V = \\frac{valor_{ADC}}{4095} \\times 3.3V$$
  </div>
</div>
<div class="box box-blue">
  <h3>🔄 Modulación por Ancho de Pulso (PWM)</h3>
  <p style="font-size:12px"><span class="proto">PWM</span> genera una señal cuadrada de frecuencia fija variando el <strong>duty cycle</strong> (porcentaje de tiempo en HIGH):</p>
  <div class="formula-box">
    $$Duty\\,Cycle = \\frac{brillo}{255} \\times 100\\%$$
  </div>
  <p style="font-size:12px">Con resolución de <span class="numval">8 bits</span>: 256 niveles de brillo (0=apagado, 255=máximo).</p>
  <p style="font-size:12px">Frecuencia configurada: <span class="numval">5000 Hz</span> — imperceptible para el ojo humano.</p>
</div>
<div class="box box-blue">
  <h3>⚡ Ley de Ohm</h3>
  <div class="formula-box">
    $$V = I \\times R \\qquad I = \\frac{V}{R} \\qquad P = V \\times I$$
  </div>
  <p style="font-size:12px">El potenciómetro actúa como divisor de voltaje variable entre <span class="numval">0V</span> y <span class="numval">3.3V</span>.</p>
</div>
`);

// Generate particles for cover
function generateParticles(){
  const container = document.getElementById('particles-container');
  if(!container) return;
  for(let i=0;i<30;i++){
    const p = document.createElement('div');
    p.className='particle';
    p.style.left = Math.random()*100+'%';
    p.style.animationDuration = (8+Math.random()*12)+'s';
    p.style.animationDelay = Math.random()*10+'s';
    p.style.width = (2+Math.random()*3)+'px';
    p.style.height = p.style.width;
    p.style.background = ['#0066FF','#00CC66','#00AACC','#FFAA00'][Math.floor(Math.random()*4)];
    container.appendChild(p);
  }
}

function renderSpread(idx, direction){
  const leftIdx = idx*2;
  const rightIdx = idx*2+1;
  
  // Animation
  const dir = direction||'none';
  if(dir==='next'){
    pageLeft.classList.add('flipping-left');
    pageRight.classList.add('flipping-left');
  } else if(dir==='prev'){
    pageLeft.classList.add('flipping-right');
    pageRight.classList.add('flipping-right');
  }
  
  const doRender = ()=>{
    pageLeft.innerHTML = (pages[leftIdx]||'') + '<div class="page-number">'+(leftIdx+1)+'</div>';
    pageRight.innerHTML = (pages[rightIdx]||'<div style="display:flex;align-items:center;justify-content:center;min-height:400px;color:#1A3A6A;font-size:20px;font-family:Orbitron,sans-serif">Página en blanco</div>') + '<div class="page-number">'+(rightIdx+1)+'</div>';
    
    // Remove animation classes
    pageLeft.classList.remove('flipping-left','flipping-right');
    pageRight.classList.remove('flipping-left','flipping-right');
    // Reset transform with requestAnimationFrame to prevent stuck state
    requestAnimationFrame(()=>{
      pageLeft.style.transition='none';
      pageRight.style.transition='none';
      pageLeft.style.transform='rotateY(0deg)';
      pageRight.style.transform='rotateY(0deg)';
      pageLeft.style.opacity='1';
      pageRight.style.opacity='1';
      requestAnimationFrame(()=>{
        pageLeft.style.transition='';
        pageRight.style.transition='';
      });
    });
    
    indicator.textContent = (leftIdx+1)+'-'+(rightIdx+1)+' / '+pages.length;
    btnPrev.disabled = idx===0;
    btnNext.disabled = idx>=totalSpreads-1;
    progressBar.style.width = ((idx+1)/totalSpreads*100)+'%';
    
    // Post-render: init simulations/charts if visible
    if(leftIdx===0) generateParticles();
    initSimulations();
    initCharts();
    // Re-render MathJax
    if(window.MathJax && MathJax.typeset) {
      try { MathJax.typeset(); } catch(e){}
    }
  };
  
  if(dir!=='none'){
    setTimeout(doRender, 350);
  } else {
    doRender();
  }
}

function goToSpread(idx, dir){
  if(idx<0||idx>=totalSpreads) return;
  currentSpread = idx;
  renderSpread(idx, dir);
}

function goToPage(pageIdx){
  const spread = Math.floor(pageIdx/2);
  goToSpread(spread, spread>currentSpread?'next':'prev');
}

btnPrev.addEventListener('click',()=>goToSpread(currentSpread-1,'prev'));
btnNext.addEventListener('click',()=>goToSpread(currentSpread+1,'next'));

document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowLeft') goToSpread(currentSpread-1,'prev');
  if(e.key==='ArrowRight') goToSpread(currentSpread+1,'next');
});

  if(sel.rangeCount===0||sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  // Check if selection is within a page
  const page = range.commonAncestorContainer.nodeType===1?
    range.commonAncestorContainer.closest('.page'):
    range.commonAncestorContainer.parentElement.closest('.page');
  if(!page) return;
  const mark = document.createElement('mark');
  mark.className = 'hl-mark-'+highlightColor;
  try{range.surroundContents(mark);}catch(e){}
  sel.removeAllRanges();
  // Store

  if(!hlStorage[spreadKey]) hlStorage[spreadKey]=[];
});

// SIMULATIONS
// ═══════════════════════════════════════════════════════════════
function initSimulations(){
  // P1 Simulation
  const sliderTemp = document.getElementById('slider-temp');
  const sliderHum = document.getElementById('slider-hum');
  if(sliderTemp && !sliderTemp._init){
    sliderTemp._init = true;
    const update = ()=>{
      const t = parseFloat(sliderTemp.value);
      const h = parseFloat(sliderHum.value);
      document.getElementById('val-temp').textContent = t.toFixed(1)+' °C';
      document.getElementById('val-hum').textContent = h.toFixed(1)+' %';
      document.getElementById('oled-temp-val').textContent = t.toFixed(1)+' °C';
      document.getElementById('oled-hum-val').textContent = h.toFixed(1)+' %';
    };
    sliderTemp.addEventListener('input', update);
    sliderHum.addEventListener('input', update);
    document.getElementById('btn-fail-read').addEventListener('click',()=>{
      document.getElementById('oled-temp-val').textContent = 'Error al leer';
      document.getElementById('oled-hum-val').textContent = 'el sensor DHT';
      setTimeout(()=>{
        const t = parseFloat(sliderTemp.value);
        const h = parseFloat(sliderHum.value);
        document.getElementById('oled-temp-val').textContent = t.toFixed(1)+' °C';
        document.getElementById('oled-hum-val').textContent = h.toFixed(1)+' %';
      },3000);
    });
  }
  
  // P2 Simulation
  const sliderPot = document.getElementById('slider-pot');
  if(sliderPot && !sliderPot._init){
    sliderPot._init = true;
    const serialDiv = document.getElementById('serial-p2');
    let serialLines = [];
    const canvas = document.getElementById('sim-pot-canvas');
    const ctx = canvas.getContext('2d');
    
    const updateP2 = ()=>{
      const val = parseInt(sliderPot.value);
      const volt = (val*3.3/4095).toFixed(2);
      const pwm = Math.round(val*255/4095);
      document.getElementById('val-adc').textContent = val;
      document.getElementById('val-volt').textContent = volt+' V';
      document.getElementById('val-pwm').textContent = pwm;
      
      // Draw LED + Pot
      ctx.clearRect(0,0,500,200);
      // Pot knob
      ctx.save();
      ctx.translate(120,100);
      ctx.beginPath();
      ctx.arc(0,0,50,0,Math.PI*2);
      ctx.fillStyle='#1A2A3A';ctx.fill();
      ctx.strokeStyle='#4A7ACC';ctx.lineWidth=3;ctx.stroke();
      const angle = (val/4095)*Math.PI*1.5 - Math.PI*0.75;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(angle)*40, Math.sin(angle)*40);
      ctx.strokeStyle='#FFAA00';ctx.lineWidth=4;ctx.stroke();
      ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fillStyle='#FFAA00';ctx.fill();
      ctx.restore();
      ctx.fillStyle='#6699CC';ctx.font='12px "Fira Code"';ctx.textAlign='center';
      ctx.fillText('Potenciómetro',120,170);
      
      // LED
      const brightness = pwm/255;
      ctx.save();
      ctx.translate(380,100);
      // Glow
      if(brightness>0.05){
        const grad = ctx.createRadialGradient(0,-10,5,0,-10,60*brightness);
        grad.addColorStop(0,`rgba(255,60,60,${brightness*0.6})`);
        grad.addColorStop(1,'rgba(255,60,60,0)');
        ctx.fillStyle=grad;
        ctx.fillRect(-60,-70,120,120);
      }
      // LED body
      ctx.beginPath();
      ctx.arc(0,-10,20,Math.PI,0);
      ctx.lineTo(20,20);ctx.lineTo(-20,20);ctx.closePath();
      ctx.fillStyle=`rgba(255,${40+brightness*80},${40+brightness*40},${0.3+brightness*0.7})`;
      ctx.fill();
      ctx.strokeStyle='#CC4444';ctx.lineWidth=2;ctx.stroke();
      // Legs
      ctx.beginPath();ctx.moveTo(-8,20);ctx.lineTo(-8,50);ctx.strokeStyle='#888';ctx.lineWidth=2;ctx.stroke();
      ctx.beginPath();ctx.moveTo(8,20);ctx.lineTo(8,50);ctx.stroke();
      ctx.restore();
      ctx.fillStyle='#6699CC';ctx.fillText('LED (PWM: '+pwm+')',380,170);
      
      // Arrow
      ctx.beginPath();ctx.moveTo(180,100);ctx.lineTo(300,100);
      ctx.strokeStyle='#0066FF';ctx.lineWidth=2;ctx.stroke();
      ctx.beginPath();ctx.moveTo(295,95);ctx.lineTo(305,100);ctx.lineTo(295,105);
      ctx.fillStyle='#0066FF';ctx.fill();
      ctx.fillStyle='#4488FF';ctx.font='11px "Fira Code"';
      ctx.fillText(volt+'V',240,90);
      
      // Serial output
      const msg = 'Valor: '+val+'   Voltaje: '+volt+' V   Brillo: '+pwm;
      serialLines.push(msg);
      if(serialLines.length>8) serialLines.shift();
      if(serialDiv) serialDiv.innerHTML = serialLines.map(l=>'> '+l).join('<br>');
    };
    sliderPot.addEventListener('input', updateP2);
    updateP2();
  }
  
  // P3 Simulation - Radar
  const sliderDist = document.getElementById('slider-dist');
  if(sliderDist && !sliderDist._init){
    sliderDist._init = true;
    const canvas = document.getElementById('sim-radar');
    const ctx = canvas.getContext('2d');
    let radarAngle = 0;
    
    const updateP3 = ()=>{
      const dist = parseFloat(sliderDist.value);
      const duration = (dist*58.4).toFixed(0);
      document.getElementById('val-dist').textContent = dist.toFixed(1)+' cm';
      document.getElementById('oled-dist-val').textContent = dist.toFixed(1)+' cm';
      document.getElementById('val-echo-dur').textContent = duration+' μs';
      document.getElementById('val-formula').textContent = duration+' / 58.4 = '+dist.toFixed(1)+' cm';
    };
    sliderDist.addEventListener('input', updateP3);
    updateP3();
    
    // Radar animation
    function drawRadar(){
      if(!document.getElementById('sim-radar')) return;
      const w=500,h=300;
      ctx.clearRect(0,0,w,h);
      
      // Background
      ctx.fillStyle='#020810';ctx.fillRect(0,0,w,h);
      
      // Radar circles
      const cx=250,cy=280;
      for(let r=40;r<=250;r+=50){
        ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,0);
        ctx.strokeStyle='rgba(0,170,204,0.15)';ctx.lineWidth=1;ctx.stroke();
        // Label
        const labelDist = Math.round(r/250*400);
        ctx.fillStyle='#2A4A6A';ctx.font='9px "Fira Code"';ctx.textAlign='center';
        ctx.fillText(labelDist+'cm',cx+r+15,cy-5);
      }
      
      // Radial lines
      for(let a=0;a<=180;a+=30){
        const rad = a*Math.PI/180;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.lineTo(cx+Math.cos(Math.PI+rad)*250, cy-Math.sin(rad)*250);
        ctx.strokeStyle='rgba(0,170,204,0.1)';ctx.stroke();
      }
      
      // Sweep
      radarAngle = (radarAngle+2)%180;
      const sweepRad = (radarAngle)*Math.PI/180;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.cos(Math.PI+sweepRad)*250, cy-Math.sin(sweepRad)*250);
      ctx.strokeStyle='rgba(0,255,170,0.8)';ctx.lineWidth=2;ctx.stroke();
      
      // Sweep glow
      const grad = ctx.createLinearGradient(cx,cy,
        cx+Math.cos(Math.PI+sweepRad)*250, cy-Math.sin(sweepRad)*250);
      grad.addColorStop(0,'rgba(0,255,170,0.3)');
      grad.addColorStop(1,'rgba(0,255,170,0)');
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      const sw1 = (radarAngle-15)*Math.PI/180;
      const sw2 = radarAngle*Math.PI/180;
      ctx.arc(cx,cy,250,Math.PI+sw1,Math.PI+sw2);
      ctx.closePath();
      ctx.fillStyle=grad;ctx.fill();
      
      // Object dot
      const dist = parseFloat(sliderDist?.value||50);
      const objR = dist/400*250;
      const objAngle = 90*Math.PI/180;
      const objX = cx+Math.cos(Math.PI+objAngle)*objR;
      const objY = cy-Math.sin(objAngle)*objR;
      
      ctx.beginPath();ctx.arc(objX,objY,6,0,Math.PI*2);
      ctx.fillStyle='#00FF88';ctx.fill();
      ctx.beginPath();ctx.arc(objX,objY,12,0,Math.PI*2);
      ctx.strokeStyle='rgba(0,255,136,0.4)';ctx.lineWidth=2;ctx.stroke();
      
      // Ultrasound waves
      const time = Date.now()/1000;
      for(let w=0;w<3;w++){
        const waveR = ((time*100+w*30)%objR);
        if(waveR>10){
          ctx.beginPath();
          ctx.arc(cx,cy,waveR,Math.PI+1.2,Math.PI+1.9);
          ctx.strokeStyle=`rgba(0,170,204,${0.5-waveR/objR*0.5})`;
          ctx.lineWidth=2;ctx.stroke();
        }
      }
      
      // Labels
      ctx.fillStyle='#00AACC';ctx.font='13px "Orbitron"';ctx.textAlign='center';
      ctx.fillText('SONAR HC-SR04',250,25);
      
      requestAnimationFrame(drawRadar);
    }
    drawRadar();
  }
}

const chartData = {
  temp: [], hum: [], dist: []
};
let chartIntervals = {};

function initCharts(){
  // Temperature chart
  const tempCanvas = document.getElementById('chart-temp');
  if(tempCanvas && !tempCanvas._init){
    tempCanvas._init = true;
    chartIntervals.temp = setInterval(()=>{
      const t = 22+Math.random()*6+Math.sin(Date.now()/5000)*3;
      chartData.temp.push(t);
      if(chartData.temp.length>60) chartData.temp.shift();
      drawLineChart(tempCanvas, chartData.temp, '#00FF88', 'Temperatura (°C)', 15, 35);
    },500);
  }
  
  // Humidity chart
  const humCanvas = document.getElementById('chart-hum');
  if(humCanvas && !humCanvas._init){
    humCanvas._init = true;
    chartIntervals.hum = setInterval(()=>{
      const h = 55+Math.random()*10+Math.cos(Date.now()/7000)*8;
      chartData.hum.push(h);
      if(chartData.hum.length>60) chartData.hum.shift();
      drawLineChart(humCanvas, chartData.hum, '#00CCEE', 'Humedad (%)', 40, 80, true);
    },500);
  }
  
  // ADC vs Voltage chart (static)
  const adcCanvas = document.getElementById('chart-adc');
  if(adcCanvas && !adcCanvas._init){
    adcCanvas._init = true;
    drawStaticChart(adcCanvas, x=>x*3.3/4095, 0, 4095, '#FFAA00', 'Valor ADC', 'Voltaje (V)', 200);
  }
  
  // PWM vs ADC chart (static)
  const pwmCanvas = document.getElementById('chart-pwm');
  if(pwmCanvas && !pwmCanvas._init){
    pwmCanvas._init = true;
    drawStaticChart(pwmCanvas, x=>Math.round(x*255/4095), 0, 4095, '#00FF88', 'Valor ADC', 'Brillo PWM', 200);
  }
  
  // Distance chart
  const distCanvas = document.getElementById('chart-dist');
  if(distCanvas && !distCanvas._init){
    distCanvas._init = true;
    chartIntervals.dist = setInterval(()=>{
      const d = 30+Math.random()*40+Math.sin(Date.now()/3000)*20;
      chartData.dist.push(Math.max(2,d));
      if(chartData.dist.length>60) chartData.dist.shift();
      drawLineChart(distCanvas, chartData.dist, '#00CCEE', 'Distancia (cm)', 0, 100);
    },500);
  }
  
  // Echo vs Distance (static)
  const echoCanvas = document.getElementById('chart-echo');
  if(echoCanvas && !echoCanvas._init){
    echoCanvas._init = true;
    drawStaticChart(echoCanvas, x=>x*58.4, 0, 400, '#FFAA00', 'Distancia (cm)', 'Duración (μs)', 200);
  }
}

function drawLineChart(canvas, data, color, label, minY, maxY, fill=false){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const pad = {l:50,r:20,t:20,b:30};
  
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#020810';ctx.fillRect(0,0,w,h);
  
  // Grid
  ctx.strokeStyle='rgba(0,120,255,0.08)';ctx.lineWidth=0.5;
  for(let y=pad.t;y<=h-pad.b;y+=30){
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();
  }
  for(let x=pad.l;x<=w-pad.r;x+=40){
    ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,h-pad.b);ctx.stroke();
  }
  
  // Axes labels
  ctx.fillStyle='#4A6A8A';ctx.font='10px "Fira Code"';
  ctx.textAlign='right';
  for(let i=0;i<=4;i++){
    const val = minY+(maxY-minY)*i/4;
    const y = h-pad.b-(h-pad.t-pad.b)*i/4;
    ctx.fillText(val.toFixed(1),pad.l-4,y+4);
  }
  ctx.textAlign='center';
  ctx.fillText(label, w/2, h-4);
  
  if(data.length<2) return;
  
  // Draw line
  ctx.beginPath();
  const drawW = w-pad.l-pad.r;
  const drawH = h-pad.t-pad.b;
  data.forEach((v,i)=>{
    const x = pad.l+i/(data.length-1)*drawW;
    const y = h-pad.b-((v-minY)/(maxY-minY))*drawH;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle=color;ctx.lineWidth=2;
  ctx.shadowColor=color;ctx.shadowBlur=12;
  ctx.stroke();
  ctx.shadowBlur=0;
  
  if(fill){
    ctx.lineTo(pad.l+(data.length-1)/(data.length-1)*drawW, h-pad.b);
    ctx.lineTo(pad.l, h-pad.b);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0,pad.t,0,h-pad.b);
    grad.addColorStop(0,color.replace(')',',0.3)').replace('rgb','rgba'));
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=`${color}22`;ctx.fill();
  }
  
  // Current value dot
  const lastV = data[data.length-1];
  const lastX = pad.l+(data.length-1)/(data.length-1)*drawW;
  const lastY = h-pad.b-((lastV-minY)/(maxY-minY))*drawH;
  ctx.beginPath();ctx.arc(lastX,lastY,4,0,Math.PI*2);
  ctx.fillStyle=color;ctx.fill();
  ctx.fillStyle='#fff';ctx.font='11px "Fira Code"';ctx.textAlign='left';
  ctx.fillText(lastV.toFixed(1),lastX+8,lastY-4);
}

function drawStaticChart(canvas, fn, xMin, xMax, color, xLabel, yLabel, steps){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const pad = {l:60,r:20,t:20,b:30};
  
  ctx.fillStyle='#020810';ctx.fillRect(0,0,w,h);
  
  // Calculate y range
  let yMin = Infinity, yMax = -Infinity;
  for(let i=0;i<=steps;i++){
    const x = xMin+i/steps*(xMax-xMin);
    const y = fn(x);
    if(y<yMin) yMin=y;
    if(y>yMax) yMax=y;
  }
  yMin = Math.floor(yMin);
  yMax = Math.ceil(yMax);
  
  // Grid
  ctx.strokeStyle='rgba(0,120,255,0.08)';ctx.lineWidth=0.5;
  for(let y=pad.t;y<=h-pad.b;y+=25){
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();
  }
  
  // Axes
  ctx.fillStyle='#4A6A8A';ctx.font='10px "Fira Code"';
  ctx.textAlign='right';
  for(let i=0;i<=4;i++){
    const val = yMin+(yMax-yMin)*i/4;
    const y = h-pad.b-(h-pad.t-pad.b)*i/4;
    ctx.fillText(val.toFixed(1),pad.l-4,y+4);
  }
  ctx.textAlign='center';
  ctx.fillText(xLabel, w/2, h-4);
  ctx.save();ctx.translate(12,h/2);ctx.rotate(-Math.PI/2);
  ctx.fillText(yLabel,0,0);ctx.restore();
  
  // Draw curve
  ctx.beginPath();
  const drawW = w-pad.l-pad.r;
  const drawH = h-pad.t-pad.b;
  for(let i=0;i<=steps;i++){
    const x = xMin+i/steps*(xMax-xMin);
    const y = fn(x);
    const px = pad.l+i/steps*drawW;
    const py = h-pad.b-((y-yMin)/(yMax-yMin))*drawH;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.strokeStyle=color;ctx.lineWidth=2.5;
  ctx.shadowColor=color;ctx.shadowBlur=12;
  ctx.stroke();
  ctx.shadowBlur=0;
}

window.resetChart = function(type){
  chartData[type] = [];
};

window.exportChart = function(canvasId){
  const canvas = document.getElementById(canvasId);
  const link = document.createElement('a');
  link.download = canvasId+'.png';
  link.href = canvas.toDataURL();
  link.click();
};
